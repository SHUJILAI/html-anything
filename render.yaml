# One-click Render deployment blueprint.
# After pushing this repo, click the "Deploy to Render" button in README.md
# or visit https://dashboard.render.com/blueprints/new and pick this repo.
services:
  - type: web
    name: html-anything
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    envVars:
      - key: AI_GATEWAY_BASE_URL
        sync: false   # set in dashboard
      - key: AI_GATEWAY_API_KEY
        sync: false   # set in dashboard
      - key: ACCESS_TOKEN
        generateValue: true
      - key: HA_MODEL
        value: anthropic/claude-sonnet-4.6
      - key: MAX_CONTENT_CHARS
        value: "50000"
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/styles
